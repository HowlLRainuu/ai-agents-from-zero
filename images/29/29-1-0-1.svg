<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060" role="img" aria-labelledby="title desc">
  <title id="title">课程关键词数据中的一条真实 ShareGPT 训练记录</title>
  <desc id="desc">根据 keywords_data_sharegpt_small.jsonl 的第 1 条记录排版。图中标出 conversations 数组、user 输入、assistant 参考答案和英文分号。</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1440" height="1060" rx="28" fill="#f8fafc"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="70" y="72" font-size="34" font-weight="700" fill="#0f172a">一条真实 ShareGPT 训练记录，模型到底会看到什么？</text>
    <text x="70" y="110" font-size="20" fill="#475569">示例文件：案例与源码-4-微调/keywords_data_sharegpt_small.jsonl，第 1 条记录；为便于阅读而换行，字段和值未改写</text>

    <rect x="65" y="150" width="960" height="830" rx="24" fill="#0f172a" filter="url(#shadow)"/>
    <rect x="65" y="150" width="960" height="70" rx="24" fill="url(#header)"/>
    <circle cx="105" cy="185" r="9" fill="#fb7185"/><circle cx="135" cy="185" r="9" fill="#fbbf24"/><circle cx="165" cy="185" r="9" fill="#4ade80"/>
    <text x="205" y="193" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="19" fill="#cbd5e1">keywords_data_sharegpt_small.jsonl · record 1</text>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'PingFang SC','Microsoft YaHei',monospace" font-size="20">
      <g fill="#64748b" text-anchor="end"><text x="115" y="275">1</text><text x="115" y="325">2</text><text x="115" y="375">3</text><text x="115" y="425">4</text><text x="115" y="475">5</text><text x="115" y="525">6</text><text x="115" y="575">7</text><text x="115" y="625">8</text><text x="115" y="675">9</text><text x="115" y="725">10</text><text x="115" y="775">11</text><text x="115" y="825">12</text><text x="115" y="875">13</text><text x="115" y="925">14</text></g>
      <text x="155" y="275" fill="#e2e8f0">{</text>
      <text x="195" y="325" fill="#93c5fd">"conversations"</text><text x="390" y="325" fill="#e2e8f0">: [</text>
      <text x="235" y="375" fill="#e2e8f0">{</text>
      <text x="275" y="425" fill="#93c5fd">"content"</text><text x="430" y="425" fill="#e2e8f0">: </text><text x="455" y="425" fill="#fde68a">"高氟铍矿石在熔炼过程中配入氢氧化铝来脱除其中的氟.</text>
      <text x="455" y="475" fill="#fde68a">结果表明,在配入5％Na2CO3、9.3％Al(OH)3、1400～1500℃熔炼20 min的情况下,</text>
      <text x="455" y="525" fill="#fde68a">BeO回收率达到96％以上,脱氟效果良好(铍玻璃F/BeO能控制在15％以内).</text>
      <text x="455" y="575" fill="#fde68a">为高氟铍矿石的工业应用探索出新的冶炼途径.\n找出上文中的关键词"</text>
      <text x="275" y="625" fill="#93c5fd">"role"</text><text x="390" y="625" fill="#e2e8f0">: </text><text x="415" y="625" fill="#86efac">"user"</text>
      <text x="235" y="675" fill="#e2e8f0">},</text>
      <text x="235" y="725" fill="#e2e8f0">{</text>
      <text x="275" y="775" fill="#93c5fd">"content"</text><text x="430" y="775" fill="#e2e8f0">: </text><text x="455" y="775" fill="#fde68a">"高氟铍矿</text><text x="580" y="775" fill="#fbbf24" font-weight="700">;</text><text x="597" y="775" fill="#fde68a">配料</text><text x="640" y="775" fill="#fbbf24" font-weight="700">;</text><text x="657" y="775" fill="#fde68a">熔炼</text><text x="700" y="775" fill="#fbbf24" font-weight="700">;</text><text x="717" y="775" fill="#fde68a">回收率</text><text x="777" y="775" fill="#fbbf24" font-weight="700">;</text><text x="794" y="775" fill="#fde68a">脱氟率"</text>
      <text x="275" y="825" fill="#93c5fd">"role"</text><text x="390" y="825" fill="#e2e8f0">: </text><text x="415" y="825" fill="#c4b5fd">"assistant"</text>
      <text x="235" y="875" fill="#e2e8f0">}</text>
      <text x="195" y="925" fill="#e2e8f0">]</text>
      <text x="155" y="975" fill="#e2e8f0">}</text>
    </g>

    <line x1="390" y1="325" x2="1080" y2="300" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="485" y1="625" x2="1080" y2="475" stroke="#22c55e" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="510" y1="825" x2="1080" y2="660" stroke="#8b5cf6" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="702" y1="775" x2="1080" y2="835" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="1095" y="235" width="280" height="130" rx="20" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="1135" cy="278" r="20" fill="#2563eb"/><text x="1135" y="285" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">1</text>
    <text x="1170" y="282" font-size="22" font-weight="700" fill="#1e3a8a">conversations</text>
    <text x="1125" y="318" font-size="18" fill="#475569">这一条样本的整段对话。</text>
    <text x="1125" y="345" font-size="18" fill="#475569">列表可以扩展成多轮对话。</text>

    <rect x="1095" y="410" width="280" height="130" rx="20" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
    <circle cx="1135" cy="453" r="20" fill="#16a34a"/><text x="1135" y="460" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">2</text>
    <text x="1170" y="457" font-size="22" font-weight="700" fill="#166534">role: user</text>
    <text x="1125" y="493" font-size="18" fill="#475569">训练题目：原文 + 任务要求。</text>
    <text x="1125" y="520" font-size="18" fill="#475569">模型把它当成回答所需的上下文。</text>

    <rect x="1095" y="595" width="280" height="130" rx="20" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="1135" cy="638" r="20" fill="#7c3aed"/><text x="1135" y="645" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">3</text>
    <text x="1170" y="642" font-size="22" font-weight="700" fill="#6d28d9">role: assistant</text>
    <text x="1125" y="678" font-size="18" fill="#475569">参考答案：训练时希望模型</text>
    <text x="1125" y="705" font-size="18" fill="#475569">学会生成的关键词列表。</text>

    <rect x="1095" y="780" width="280" height="130" rx="20" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="1135" cy="823" r="20" fill="#d97706"/><text x="1135" y="830" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">4</text>
    <text x="1170" y="827" font-size="22" font-weight="700" fill="#92400e">英文分号 ;</text>
    <text x="1125" y="863" font-size="18" fill="#475569">课程要求用它分隔关键词，</text>
    <text x="1125" y="890" font-size="18" fill="#475569">不要写中文分号或额外解释。</text>
  </g>
</svg>
