<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
<title id="title">每批处理几条，与处理几批才更新，是两件事</title>
<desc id="desc">单卡教学示意。蓝色一行有8个小批，每批4条；绿色一行有16个小批，每批2条。小批沿箭头依次处理，整组内权重保持不变，梯度逐批累积。每组处理32条之后才更新一次参数；下一组使用新参数。32条没有同时进入GPU。两种安排有效批次相同，但不保证速度或训练结果相同。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#526278"/></marker></defs>
<rect width="1100" height="680" fill="#ffffff"/>
<g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#172b4d">
<text x="30" y="48" font-size="35" fill="#172b4d" font-weight="700" text-anchor="start">每批处理几条，和处理几批才更新，是两件事</text>
<text x="30" y="88" font-size="25" fill="#526278" font-weight="400" text-anchor="start">每个小框是一批，框内数字是条数；沿箭头依次处理。</text>
<g id="arrangement-A" data-batch-size="4" data-accumulation="8">
<rect x="20" y="116" width="1060" height="202" rx="15" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="40" y="158" font-size="29" fill="#2563eb" font-weight="700" text-anchor="start">安排 A：每批 4 条，累积 8 批</text>
<g data-batch="1" data-samples="4"><rect x="40.0" y="186" width="74.0" height="55" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="77.0" y="223" font-size="28" fill="#2563eb" font-weight="700" text-anchor="middle">4</text>
</g>
<path d="M116.0 213 L134.0 213" stroke="#526278" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
