<text x="269.0" y="223" font-size="28" fill="#2563eb" font-weight="700" text-anchor="middle">4</text>
</g>
<path d="M308.0 213 L326.0 213" stroke="#526278" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<g data-batch="4" data-samples="4"><rect x="328.0" y="186" width="74.0" height="55" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="365.0" y="223" font-size="28" fill="#2563eb" font-weight="700" text-anchor="middle">4</text>
</g>
<path d="M404.0 213 L422.0 213" stroke="#526278" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<g data-batch="5" data-samples="4"><rect x="424.0" y="186" width="74.0" height="55" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="461.0" y="223" font-size="28" fill="#2563eb" font-weight="700" text-anchor="middle">4</text>
</g>
