<path d="M797 437 L843 437" stroke="#526278" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="850" y="405" width="208" height="76" rx="10" fill="#087f83"/>
<text x="954" y="435" font-size="29" fill="white" font-weight="700" text-anchor="middle">更新 1 次</text>
<text x="954" y="466" font-size="24" fill="white" font-weight="400" text-anchor="middle">step + 1</text>
<path d="M40 475 v10 h746 v-10" fill="none" stroke="#087f83" stroke-width="1.5"/>
<text x="413" y="522" font-size="25" fill="#087f83" font-weight="400" text-anchor="middle">组内暂不更新权重，梯度逐批累积</text>
<text x="954" y="520" font-size="25" fill="#087f83" font-weight="700" text-anchor="middle">2 × 16 = 32 条</text>
</g>
<text x="550" y="591" font-size="29" fill="#172b4d" font-weight="700" text-anchor="middle">更新后，下一组再使用新参数。</text>
<text x="550" y="629" font-size="25" fill="#172b4d" font-weight="400" text-anchor="middle">每次同时处理的更少，累计的批数更多；32 条并没有一起进入 GPU。</text>
<text x="550" y="664" font-size="23" fill="#526278" font-weight="400" text-anchor="middle">两种安排的有效批次都是 32；相同有效批次不保证相同速度或训练结果。</text>
</g></svg>
