<g data-batch="6" data-samples="4"><rect x="520.0" y="186" width="74.0" height="55" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="557.0" y="223" font-size="28" fill="#2563eb" font-weight="700" text-anchor="middle">4</text>
</g>
<path d="M596.0 213 L614.0 213" stroke="#526278" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<g data-batch="7" data-samples="4"><rect x="616.0" y="186" width="74.0" height="55" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="653.0" y="223" font-size="28" fill="#2563eb" font-weight="700" text-anchor="middle">4</text>
</g>
<path d="M692.0 213 L710.0 213" stroke="#526278" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<g data-batch="8" data-samples="4"><rect x="712.0" y="186" width="74.0" height="55" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="749.0" y="223" font-size="28" fill="#2563eb" font-weight="700" text-anchor="middle">4</text>
</g>
<path d="M797 213 L843 213" stroke="#526278" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="850" y="181" width="208" height="76" rx="10" fill="#2563eb"/>
<text x="954" y="211" font-size="29" fill="white" font-weight="700" text-anchor="middle">更新 1 次</text>
<text x="954" y="242" font-size="24" fill="white" font-weight="400" text-anchor="middle">step + 1</text>
<path d="M40 251 v10 h746 v-10" fill="none" stroke="#2563eb" stroke-width="1.5"/>
<text x="413" y="298" font-size="25" fill="#2563eb" font-weight="400" text-anchor="middle">组内暂不更新权重，梯度逐批累积</text>
<text x="954" y="296" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">4 × 8 = 32 条</text>
</g>
