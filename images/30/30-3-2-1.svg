<text x="150" y="523" class="small">升到 5e-5</text>
<text x="352" y="486" class="head">先小步起步，再逐渐减小</text>
<text x="352" y="527">预热 5 步包含在 150 步之内，</text><text x="352" y="560">不是额外增加 5 步训练。</text>
<text x="352" y="601" class="small">局部图放大了横轴，不改变主图比例。</text>
<text x="36" y="653" class="small">这不是实测曲线；具体日志读数仍需结合调度器步号和记录时机。</text>
