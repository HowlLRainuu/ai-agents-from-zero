<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310" role="img" aria-labelledby="title desc">
<title id="title">从 AutoDL 控制台打开 JupyterLab 终端</title>
<desc id="desc">两张真实界面局部截图：在 AutoDL 快捷工具点击 JupyterLab；在启动页的其他区域选择终端。浏览器显示窗口，命令在远端实例执行。</desc>
<rect width="760" height="310" rx="14" fill="#f7f9fc"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#182c48">
<text x="26" y="37" font-size="23" font-weight="600">从控制台进入远端终端</text>
<text x="40" y="78" font-size="17" font-weight="600">① AutoDL 快捷工具</text>
<text x="345" y="78" font-size="17" font-weight="600">② 启动页 → 其他 → 终端</text>
<rect x="30" y="91" width="210" height="167" rx="8" fill="white" stroke="#d6e0ec"/>
<image href="data:image/png;base64," x="68" y="104" width="119" height="125"/>
<path d="M256 173h65m-12-9 12 9-12 9" stroke="#2563a8" stroke-width="3" fill="none"/>
<rect x="337" y="91" width="396" height="167" rx="8" fill="white" stroke="#d6e0ec"/>
<image href="data:image/png;base64," x="350" y="96" width="355" height="158" preserveAspectRatio="xMidYMid meet"/>
<text x="40" y="290" font-size="16">选“终端”，不选 Python 笔记本或控制台。这里的命令在 AutoDL 中执行。</text>
</g></svg>
