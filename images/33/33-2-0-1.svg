<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="754" viewBox="0 0 1200 754" role="img" aria-labelledby="title desc">
<title id="title">显存不足的分阶段排查</title><desc id="desc">先检查已有GPU占用，再按权重加载、训练批次或参数更新的报错阶段选择调整；重跑原报错位置后继续验证其他阶段。</desc>
<defs><marker id="arrow-2563eb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="arrow-7c3aed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#7c3aed"/></marker><marker id="arrow-059669" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#059669"/></marker><marker id="arrow-64748b" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker></defs>
<g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<rect width="1200" height="754" fill="#f8fafc"/>
<text x="36" y="52" font-size="34" fill="#0f172a" font-weight="700" text-anchor="start">显存不足，先看在哪一步报错</text>
<text x="36" y="91" font-size="24" fill="#334155" font-weight="400" text-anchor="start">同样是 CUDA out of memory，优先调整的地方可能不同。</text>
<rect x="32" y="118" width="1136" height="82" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
<text x="56" y="151" font-size="25" fill="#1d4ed8" font-weight="700" text-anchor="start">先排除已有占用</text>
<text x="56" y="184" font-size="23" fill="#334155" font-weight="400" text-anchor="start">查看 nvidia-smi；只停止已确认不再需要的模型、训练或服务。</text>
<path d="M600 200 V222 H216 V247" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-64748b)"/>
<rect x="32" y="254" width="368" height="270" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
<text x="52" y="296" font-size="28" fill="#2563eb" font-weight="700" text-anchor="start">① 加载权重时</text>
<text x="52" y="333" font-size="21" fill="#334155" font-weight="400" text-anchor="start">模型还没完整放进显存</text>
<text x="52" y="381" font-size="21" fill="#334155" font-weight="400" text-anchor="start">检查模型路径、加载精度</text>
<text x="52" y="415" font-size="21" fill="#334155" font-weight="400" text-anchor="start">再考虑较小模型或量化</text>
<text x="52" y="449" font-size="21" fill="#334155" font-weight="400" text-anchor="start">权重分片属于后面的进阶方案</text>
<text x="52" y="493" font-size="20" fill="#2563eb" font-weight="600" text-anchor="start">降低 batch 不会缩小权重</text>
<path d="M216 524 V553 H600 V579" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-64748b)"/>
<path d="M600 200 V222 H600 V247" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-64748b)"/>
<rect x="416" y="254" width="368" height="270" rx="14" fill="#f5f3ff" stroke="#c4b5fd"/>
<text x="436" y="296" font-size="28" fill="#7c3aed" font-weight="700" text-anchor="start">② 处理训练批次时</text>
<text x="436" y="333" font-size="21" fill="#334155" font-weight="400" text-anchor="start">已加载，前向或反向计算报错</text>
<text x="436" y="381" font-size="21" fill="#334155" font-weight="400" text-anchor="start">先减小单卡 batch</text>
<text x="436" y="415" font-size="21" fill="#334155" font-weight="400" text-anchor="start">检查实际长度与长样本</text>
<text x="436" y="449" font-size="21" fill="#334155" font-weight="400" text-anchor="start">确认是否已启用梯度检查点</text>
<text x="436" y="493" font-size="20" fill="#7c3aed" font-weight="600" text-anchor="start">保持有效批次时，再补足累积</text>
<path d="M600 524 V553 H600 V579" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-64748b)"/>
<path d="M600 200 V222 H984 V247" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-64748b)"/>
<rect x="800" y="254" width="368" height="270" rx="14" fill="#ecfdf5" stroke="#6ee7b7"/>
<text x="820" y="296" font-size="28" fill="#059669" font-weight="700" text-anchor="start">③ 更新参数时</text>
<text x="820" y="333" font-size="21" fill="#334155" font-weight="400" text-anchor="start">优化器建立状态或执行更新</text>
<text x="820" y="381" font-size="21" fill="#334155" font-weight="400" text-anchor="start">检查优化器相关占用</text>
<text x="820" y="415" font-size="21" fill="#334155" font-weight="400" text-anchor="start">核对 LoRA 或全参数训练</text>
<text x="820" y="449" font-size="21" fill="#334155" font-weight="400" text-anchor="start">按需评估卸载与 ZeRO 分片</text>
<text x="820" y="493" font-size="20" fill="#059669" font-weight="600" text-anchor="start">不要把学习率当作显存开关</text>
<path d="M984 524 V553 H600 V579" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-64748b)"/>
<rect x="32" y="586" width="1136" height="104" rx="14" fill="#fff" stroke="#94a3b8"/>
<text x="56" y="624" font-size="27" fill="#0f172a" font-weight="700" text-anchor="start">选一个主要调整项 → 重新试跑 → 检查原报错位置</text>
<text x="56" y="662" font-size="24" fill="#334155" font-weight="400" text-anchor="start">通过后继续观察长样本、验证和保存，再比较相同工作量下的速度。</text>
<text x="36" y="727" font-size="22" fill="#475569" font-weight="400" text-anchor="start">这些是排查方向，不是要求把所有优化选项依次打开。</text>
</g></svg>
