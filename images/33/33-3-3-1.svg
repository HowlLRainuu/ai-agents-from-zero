<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="767" viewBox="0 0 1200 767" role="img" aria-labelledby="title desc">
<title id="title">流水线并行的前向时间轴</title><desc id="desc">对照三个微批次逐份走完与交错接力的时间轴。等时长前向示例中六时段变四时段，不是实测加速。</desc>
<defs><marker id="arrow-2563eb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="arrow-7c3aed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#7c3aed"/></marker><marker id="arrow-059669" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#059669"/></marker><marker id="arrow-64748b" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker></defs>
<g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<rect width="1200" height="767" fill="#f8fafc"/>
<text x="36" y="52" font-size="34" fill="#0f172a" font-weight="700" text-anchor="start">流水线：让下一份输入早点进入</text>
<text x="36" y="91" font-size="23" fill="#334155" font-weight="400" text-anchor="start">同样处理 A、B、C 三份输入，每份都要依次经过 GPU 0 和 GPU 1。</text>
<rect x="32" y="122" width="1136" height="236" rx="14" fill="#fff" stroke="#cbd5e1"/>
<text x="56" y="160" font-size="27" fill="#0f172a" font-weight="700" text-anchor="start">逐份走完：上一份结束，下一份才开始</text>
<text x="364" y="193" font-size="20" fill="#64748b" font-weight="400" text-anchor="middle">时段 1</text>
<text x="500" y="193" font-size="20" fill="#64748b" font-weight="400" text-anchor="middle">时段 2</text>
<text x="636" y="193" font-size="20" fill="#64748b" font-weight="400" text-anchor="middle">时段 3</text>
<text x="772" y="193" font-size="20" fill="#64748b" font-weight="400" text-anchor="middle">时段 4</text>
<text x="908" y="193" font-size="20" fill="#64748b" font-weight="400" text-anchor="middle">时段 5</text>
<text x="1044" y="193" font-size="20" fill="#64748b" font-weight="400" text-anchor="middle">时段 6</text>
<text x="56" y="229" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start">GPU 0</text>
<text x="56" y="254" font-size="20" fill="#334155" font-weight="400" text-anchor="start">前半层</text>
<rect x="300" y="206" width="128" height="49" rx="14" fill="#dbeafe" stroke="#dbeafe"/>
<text x="364" y="238" font-size="25" fill="#1d4ed8" font-weight="700" text-anchor="middle">A</text>
<rect x="436" y="206" width="128" height="49" rx="14" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="500" y="238" font-size="21" fill="#64748b" font-weight="400" text-anchor="middle">等待</text>
<rect x="572" y="206" width="128" height="49" rx="14" fill="#ede9fe" stroke="#ede9fe"/>
<text x="636" y="238" font-size="25" fill="#6d28d9" font-weight="700" text-anchor="middle">B</text>
<rect x="708" y="206" width="128" height="49" rx="14" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="772" y="238" font-size="21" fill="#64748b" font-weight="400" text-anchor="middle">等待</text>
<rect x="844" y="206" width="128" height="49" rx="14" fill="#d1fae5" stroke="#d1fae5"/>
<text x="908" y="238" font-size="25" fill="#047857" font-weight="700" text-anchor="middle">C</text>
<rect x="980" y="206" width="128" height="49" rx="14" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="1044" y="238" font-size="21" fill="#64748b" font-weight="400" text-anchor="middle">等待</text>
<text x="56" y="290" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start">GPU 1</text>
<text x="56" y="315" font-size="20" fill="#334155" font-weight="400" text-anchor="start">后半层</text>
<rect x="300" y="267" width="128" height="49" rx="14" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="364" y="299" font-size="21" fill="#64748b" font-weight="400" text-anchor="middle">等待</text>
<rect x="436" y="267" width="128" height="49" rx="14" fill="#dbeafe" stroke="#dbeafe"/>
<text x="500" y="299" font-size="25" fill="#1d4ed8" font-weight="700" text-anchor="middle">A</text>
<rect x="572" y="267" width="128" height="49" rx="14" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="636" y="299" font-size="21" fill="#64748b" font-weight="400" text-anchor="middle">等待</text>
<rect x="708" y="267" width="128" height="49" rx="14" fill="#ede9fe" stroke="#ede9fe"/>
<text x="772" y="299" font-size="25" fill="#6d28d9" font-weight="700" text-anchor="middle">B</text>
<rect x="844" y="267" width="128" height="49" rx="14" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="908" y="299" font-size="21" fill="#64748b" font-weight="400" text-anchor="middle">等待</text>
<rect x="980" y="267" width="128" height="49" rx="14" fill="#d1fae5" stroke="#d1fae5"/>
<text x="1044" y="299" font-size="25" fill="#047857" font-weight="700" text-anchor="middle">C</text>
<text x="300" y="342" font-size="22" fill="#334155" font-weight="400" text-anchor="start">GPU 0 经常在等 GPU 1；三份输入用 6 个时段走完。</text>
<rect x="32" y="386" width="1136" height="236" rx="14" fill="#fff" stroke="#cbd5e1"/>
<text x="56" y="424" font-size="27" fill="#0f172a" font-weight="700" text-anchor="start">交错接力：GPU 1 算 A 时，GPU 0 开始 B</text>
<text x="364" y="457" font-size="20" fill="#64748b" font-weight="400" text-anchor="middle">时段 1</text>
<text x="500" y="457" font-size="20" fill="#64748b" font-weight="400" text-anchor="middle">时段 2</text>
<text x="636" y="457" font-size="20" fill="#64748b" font-weight="400" text-anchor="middle">时段 3</text>
<text x="772" y="457" font-size="20" fill="#64748b" font-weight="400" text-anchor="middle">时段 4</text>
<text x="56" y="493" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start">GPU 0</text>
<text x="56" y="518" font-size="20" fill="#334155" font-weight="400" text-anchor="start">前半层</text>
<rect x="300" y="470" width="128" height="49" rx="14" fill="#dbeafe" stroke="#dbeafe"/>
<text x="364" y="502" font-size="25" fill="#1d4ed8" font-weight="700" text-anchor="middle">A</text>
<rect x="436" y="470" width="128" height="49" rx="14" fill="#ede9fe" stroke="#ede9fe"/>
<text x="500" y="502" font-size="25" fill="#6d28d9" font-weight="700" text-anchor="middle">B</text>
<rect x="572" y="470" width="128" height="49" rx="14" fill="#d1fae5" stroke="#d1fae5"/>
<text x="636" y="502" font-size="25" fill="#047857" font-weight="700" text-anchor="middle">C</text>
<rect x="708" y="470" width="128" height="49" rx="14" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="772" y="502" font-size="21" fill="#64748b" font-weight="400" text-anchor="middle">等待</text>
<rect x="850" y="470" width="258" height="110" rx="14" fill="#fff" stroke="#a7f3d0"/>
<text x="979" y="515" font-size="25" fill="#047857" font-weight="700" text-anchor="middle">三份已全部完成</text>
<text x="979" y="553" font-size="20" fill="#334155" font-weight="400" text-anchor="middle">不必等到第 6 个时段</text>
<text x="56" y="554" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start">GPU 1</text>
<text x="56" y="579" font-size="20" fill="#334155" font-weight="400" text-anchor="start">后半层</text>
<rect x="300" y="531" width="128" height="49" rx="14" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="364" y="563" font-size="21" fill="#64748b" font-weight="400" text-anchor="middle">等待</text>
<rect x="436" y="531" width="128" height="49" rx="14" fill="#dbeafe" stroke="#dbeafe"/>
<text x="500" y="563" font-size="25" fill="#1d4ed8" font-weight="700" text-anchor="middle">A</text>
<rect x="572" y="531" width="128" height="49" rx="14" fill="#ede9fe" stroke="#ede9fe"/>
<text x="636" y="563" font-size="25" fill="#6d28d9" font-weight="700" text-anchor="middle">B</text>
<rect x="708" y="531" width="128" height="49" rx="14" fill="#d1fae5" stroke="#d1fae5"/>
<text x="772" y="563" font-size="25" fill="#047857" font-weight="700" text-anchor="middle">C</text>
<text x="300" y="606" font-size="22" fill="#334155" font-weight="400" text-anchor="start">第 4 个时段结束时，三份已完成；开头和末尾仍有等待。</text>
<text x="36" y="661" font-size="24" fill="#0f172a" font-weight="600" text-anchor="start">灰色格中的等待称为“气泡”；拆成微批次并交错执行，是为了减少等待。</text>
<text x="36" y="703" font-size="23" fill="#334155" font-weight="400" text-anchor="start">这里只画等时长的前向计算，忽略传输耗时；完整训练还有反向传播。</text>
<text x="36" y="738" font-size="23" fill="#334155" font-weight="400" text-anchor="start">6 → 4 是这个简化时间表的结果，不是实际训练的加速比例。</text>
</g></svg>
